<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Feel&Note · Device translation test</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header><span>Feel&Note · 번역 실험</span><small>Local test · synthetic sample text</small></header>
  <main>
    <section class="toolbar" aria-label="Translation controls">
      <select id="language" aria-label="Language"></select>
      <button id="start"></button><button id="original"></button>
      <button id="clear">캐시 비우기</button>
    </section>
    <p id="status" role="status" aria-live="polite"></p>
    <aside id="fallback" hidden><p id="advice"></p><p id="fallback-step"></p>
      <div class="toolbar"><a id="guide" target="_blank" rel="noopener noreferrer"></a><button id="copy-link"></button></div>
      <input id="page-link" type="url" readonly hidden>
    </aside>
    <article><h1>People &amp; their works</h1><p id="intro" class="prose" data-body></p><button id="open"></button></article>
    <details><summary>검증 정보</summary><pre id="diagnostics"></pre></details>
  </main>
  <dialog id="review-dialog" aria-labelledby="dialog-title">
    <h2 id="dialog-title">Reading background</h2><p id="review" class="prose" data-body></p>
    <div class="toolbar"><button id="next"></button><button id="modal-original"></button><button id="close"></button></div>
  </dialog>
  <script type="module" src="./app.mjs"></script>
</body>
</html>
