<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<title>엔키두 아바타 교체 검수</title>
<style>
  body { margin: 0; padding: 32px; background: #161718; color: #eee; font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 960px; margin: auto; }
  .row { display: flex; flex-wrap: wrap; gap: 32px; }
  figure { margin: 0; width: 280px; }
  figure img { width: 280px; height: 280px; object-fit: cover; background: #252626; }
  figure .circle { width: 96px; height: 96px; border-radius: 50%; display: block; margin: 12px auto; }
  figcaption { text-align: center; }
  p { color: #bbb; }
</style>
<main>
  <h1>엔키두 아바타 교체 검수</h1>
  <p>기존 등록본과 새 원본·크롭 후보. 새 후보는 누끼·빛·재배치와 독립 검수 전이며, 이 페이지는 업로드 완료를 뜻하지 않는다.</p>
  <div class="row">
    <figure><img src="backup/avatar.webp" alt="기존 아바타"><img class="circle" src="backup/avatar-sm.webp" alt="기존 작은 원형"><figcaption>기존 등록본</figcaption></figure>
    <figure><img src="source/enkidu.png" alt="새 원본"><img class="circle" src="source/enkidu.png" alt="새 원본 작은 원형"><figcaption>새 생성 원본</figcaption></figure>
    <figure><img src="crop/enkidu.webp" alt="새 얼굴 크롭"><img class="circle" src="crop/enkidu.webp" alt="새 크롭 작은 원형"><figcaption>새 1차 크롭</figcaption></figure>
  </div>
</main>
</html>
