name: Sync Weekly Bestsellers

# 주간 수집 결과는 공개 JSON으로 게시하고 웹이 배포 없이 읽는다.
on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

concurrency:
  group: sync-weekly-bestsellers
  cancel-in-progress: false

jobs:
  sync-bestsellers:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install collector dependency
        shell: bash
        run: |
          version=$(node -p "require('./sw/web/package.json').dependencies.cheerio.replace(/^[~^]/, '')")
          npm install --prefix "$RUNNER_TEMP/bestseller-sync" --no-package-lock --ignore-scripts "cheerio@$version"
          ln -s "$RUNNER_TEMP/bestseller-sync/node_modules" node_modules

      - name: Test collector
        run: node --test sw/web/scripts/sync-bestsellers.test.mjs

      - name: Sync bestsellers
        id: sync
        continue-on-error: true
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: node sw/web/scripts/sync-bestsellers.mjs

      - name: Commit and push changes if updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if git status --porcelain sw/web/src/constants/library/bestsellers.json | grep -q bestsellers.json; then
            git add sw/web/src/constants/library/bestsellers.json
            git commit -m "chore(library): sync weekly bestsellers and steadysellers" -- sw/web/src/constants/library/bestsellers.json
            git fetch origin main
            git rebase origin/main
            git push
          else
            echo "No changes in bestsellers.json"
          fi

      - name: Report incomplete collection
        if: steps.sync.outcome == 'failure'
        run: |
          echo "::error::Some charts could not be refreshed. Their previous lists and dates were retained."
          exit 1
