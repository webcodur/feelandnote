# 파일명: /sw/android/gradle.properties
# 기능: Gradle 빌드 옵션
# 책임: JVM·AndroidX·리소스 처리 기본값을 고정한다.
#
# 🔴 서명 정보(키스토어 경로·비밀번호·별칭)는 이 파일에 적지 않는다.
#    이 파일은 저장소에 올라간다. 서명값은 추적 대상이 아닌 keystore.properties 에서 읽는다.
#    keystore.properties.example 참조.

org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# compileSdk 36 을 AGP 가 아직 정식 지원하지 않는다고 동기화가 실패하거나 경고를 낼 때만
# 아래 줄의 주석을 풀어라. 근본 해법은 AGP 를 올리는 것이다(gradle/libs.versions.toml).
# android.suppressUnsupportedCompileSdk=36
