<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>TTS Voice Samples</title>
<style>
  body { background: #121212; color: #e8e0d0; font-family: system-ui; padding: 40px 60px; }
  h1 { color: #c8a46e; font-size: 28px; margin-bottom: 8px; }
  .subtitle { color: #888; font-size: 14px; margin-bottom: 32px; }
  .sample { display: flex; align-items: center; gap: 16px; padding: 12px 0; border-bottom: 1px solid #1e1e1e; }
  .sample:hover { background: #1a1a1a; }
  .label { min-width: 240px; font-size: 15px; }
  .tag { font-size: 12px; padding: 2px 8px; border-radius: 4px; background: #6ea4c833; color: #6ea4c8; }
  audio { height: 36px; }
  .script { color: #888; font-size: 13px; margin-top: 4px; font-style: italic; max-width: 700px; }
</style>
</head>
<body>
  <h1>Neural2-B Female — 나레이터 후보</h1>
  <div class="subtitle">SSML 호흡 제어 적용 (문장 간 500ms break, 92% speed)</div>

  <div class="script" style="margin-bottom: 24px;">짧은 샘플: "1990년대 게임 산업의 혁명을 이끈 두 천재, 존 카맥과 존 로메로의 실화를 담은 논픽션이다."</div>
  <div class="sample">
    <span class="label">Neural2-B (짧은) <span class="tag">Neural2</span></span>
    <audio controls src="neural2-B-female.mp3"></audio>
  </div>

  <div class="script" style="margin-top: 32px; margin-bottom: 24px;">긴 샘플: 셀럽 소개 + 도서 설명 + 아웃트로 합본 (54초)</div>
  <div class="sample">
    <span class="label">Neural2-B (긴) <span class="tag">Neural2</span></span>
    <audio controls src="neural2-B-female-long.mp3"></audio>
  </div>
</body>
</html>
