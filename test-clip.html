<!DOCTYPE html>
<html>
<head>
<style>
.wrapper {
  background: black;
  padding: 50px;
  color: white;
  font-size: 50px;
}
.buggy {
  background: linear-gradient(170deg, #f0d060 0%, #d4a843 40%, #f0c850 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 8px rgba(212,168,67,0.8));
}
.fixed-wrapper {
  filter: drop-shadow(0 0 8px rgba(212,168,67,0.8));
}
.fixed-inner {
  background: linear-gradient(170deg, #f0d060 0%, #d4a843 40%, #f0c850 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
</style>
</head>
<body>
  <div class="wrapper">
    <div class="buggy">Buggy Text</div>
    <div class="fixed-wrapper"><div class="fixed-inner">Fixed Text</div></div>
  </div>
</body>
</html>
