packages:
  - 'sw/web'
  - 'sw/web-bo'
  - 'sw/lab'
  - 'sw/remotion'
  - 'sw/audio-bo'
  - 'packages/*'

# 사용자 웹은 현재 컴퓨터에서 빌드한 standalone을 Oracle Linux x64에서 실행한다.
# sharp의 배포 대상 네이티브 optional dependency도 로컬 install에 함께 둔다.
supportedArchitectures:
  os:
    - current
    - linux
  cpu:
    - current
    - x64
  libc:
    - glibc

overrides:
  undici: '>=7.24.0'

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  core-js: true
  esbuild: true
  ffmpeg-static: true
  protobufjs: true
  puppeteer: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@next/env@16.4.1'
  - '@next/eslint-plugin-next@16.4.1'
  - '@next/swc-darwin-arm64@16.4.1'
  - '@next/swc-darwin-x64@16.4.1'
  - '@next/swc-linux-arm64-gnu@16.4.1'
  - '@next/swc-linux-arm64-musl@16.4.1'
  - '@next/swc-linux-x64-gnu@16.4.1'
  - '@next/swc-linux-x64-musl@16.4.1'
  - '@next/swc-win32-arm64-msvc@16.4.1'
  - '@next/swc-win32-x64-msvc@16.4.1'
  - '@next/third-parties@16.4.1'
  - eslint-config-next@16.4.1
  - next@16.4.1
