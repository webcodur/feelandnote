name: feelandnote-db
networks:
  default:
    name: feelandnote-db_default
    external: true
services:
  db:
    image: feelandnote/postgres:17.11-net0.20.3
    container_name: feelandnote-db
    restart: unless-stopped
    shm_size: 1gb
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    command: [postgres, -c, "shared_preload_libraries=pg_stat_statements,pg_net", -c, "max_connections=100", -c, "shared_buffers=3GB", -c, "effective_cache_size=7600MB", -c, "work_mem=32MB", -c, "maintenance_work_mem=512MB"]
    volumes:
      - ./data:/var/lib/postgresql/data
      - ./secrets/postgres-password:/run/secrets/postgres-password:ro
      - ./secrets/web-revalidate:/run/secrets/web-revalidate:ro
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, postgres]
      interval: 10s
      timeout: 3s
      retries: 6
  auth:
    image: feelandnote/auth:1.0.0
    container_name: feelandnote-auth
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes: ["./secrets/auth.json:/run/secrets/auth.json:ro"]
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:9999/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
  rest:
    image: postgrest/postgrest:v14.12
    container_name: feelandnote-rest
    restart: unless-stopped
    env_file: ./secrets/rest.env
    environment:
      PGRST_DB_POOL: ${DB_POOL_SIZE:-25}
      PGRST_ADMIN_SERVER_HOST: 0.0.0.0
      PGRST_ADMIN_SERVER_PORT: 3001
    depends_on:
      db: { condition: service_healthy }
  gateway:
    image: nginx:1.28-alpine
    container_name: feelandnote-gateway
    restart: unless-stopped
    ports: ["127.0.0.1:${DB_GATEWAY_PORT:-8000}:8000"]
    volumes: ["./secrets/nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [auth, rest]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8000/auth/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 6
