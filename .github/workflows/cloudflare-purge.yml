name: Cloudflare Purge After Deploy

# Vercel 프로덕션 배포가 성공하면 Cloudflare에 담긴 화면 사본을 전부 버린다.
# 배포가 끝나기 전에 퍼지하면 Cloudflare가 옛 배포 응답을 다시 담으므로 반드시 success 뒤에 돈다.
#
# 판정하지 않고 매번 버린다(26.08.19). 배포는 Vercel의 ISR 사본도 함께 새로 만들므로
# 판정으로 아끼는 것은 Cloudflare HIT 유지뿐이고, 그 이득보다 판정 단계가 무는 고장이 크다.
# 실제로 직전 배포 SHA를 gh api로 찾던 단계가 매번 매달려 퍼지가 한 번도 나가지 못했다.
on:
  deployment_status

# GITHUB_TOKEN을 쓰지 않는다 — Cloudflare API만 부른다.
permissions: {}

jobs:
  purge:
    if: github.event.deployment_status.state == 'success' && startsWith(github.event.deployment.environment, 'Production') && github.event.deployment.payload.project_name != 'feelandnote-bo'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Purge everything
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_ZONE_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "[cf-purge] Cloudflare 설정 없음 — 건너뜀"
            exit 0
          fi
          code=$(curl -sS --max-time 30 -o response.json -w '%{http_code}' \
            -X POST "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          echo "[cf-purge] 전체 퍼지 $code: $(head -c 200 response.json)"
          test "$code" = "200"
