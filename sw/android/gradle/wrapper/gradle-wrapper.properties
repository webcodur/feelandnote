# 파일명: /sw/android/gradle/wrapper/gradle-wrapper.properties
# 기능: Gradle Wrapper 설정
# 책임: 이 프로젝트가 쓸 Gradle 배포판을 고정한다.
#
# ⚠️ 같은 폴더의 gradle-wrapper.jar 는 바이너리라 이 저장소에 담기지 않았다. 얻는 법은 README 참조.
# ⚠️ distributionSha256Sum 은 실제 배포판 해시를 확인하지 못해 비워 뒀다.
#    공식 배포 페이지(https://gradle.org/release-checksums/)에서 값을 받아 채우면 배포판 위조를 막을 수 있다.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
