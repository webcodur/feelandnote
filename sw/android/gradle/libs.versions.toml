# 파일명: /sw/android/gradle/libs.versions.toml
# 기능: 버전 카탈로그
# 책임: 빌드 도구·라이브러리 버전을 한 곳에서 관리한다.
#
# ⚠️ 아래 버전은 이 저장소에서 실제로 내려받아 검증하지 못했다(Android SDK·Gradle 미설치).
#    Android Studio 동기화 시 다음을 확인하고 필요하면 올린다.
#      androidGradlePlugin  https://developer.android.com/build/releases/gradle-plugin
#      androidbrowserhelper https://central.sonatype.com/artifact/com.google.androidbrowserhelper/androidbrowserhelper/versions
#    androidGradlePlugin 을 올리면 gradle/wrapper/gradle-wrapper.properties 의 Gradle 버전도
#    함께 맞춰야 한다(AGP 는 최소 Gradle 버전을 요구한다).

[versions]
# compileSdk 36(Android 16)을 다루려면 이 계열 이상이 필요하다. 동기화가 compileSdk 를
# 문제 삼으면 gradle.properties 의 android.suppressUnsupportedCompileSdk 주석을 참고한다.
androidGradlePlugin = "8.9.1"

# TWA 구현체. LauncherActivity·DelegationService·스플래시 전달을 모두 이 라이브러리가 쥔다.
# 앱 소스 코드가 없는 이유가 이것이다 — 액티비티를 직접 쓰지 않고 라이브러리 클래스를 매니페스트에서 지목한다.
androidBrowserHelper = "2.5.0"

[libraries]
androidbrowserhelper = { group = "com.google.androidbrowserhelper", name = "androidbrowserhelper", version.ref = "androidBrowserHelper" }

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
